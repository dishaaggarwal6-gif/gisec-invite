<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>GISEC Global Invite</title>
    <style>
        /* Email Reset */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; display: block; }
        body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #000000; }
        table { border-collapse: collapse !important; }
        
        /* Mobile Responsive */
        @media screen and (max-width: 600px) {
            .email-container { width: 100% !important; max-width: 100% !important; }
            .email-container img { width: 100% !important; max-width: 100% !important; height: auto !important; }
            .fluid { width: 100% !important; max-width: 100% !important; height: auto !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #000000;">

    <!-- Main Container -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #000000;">
        <tr>
            <td align="center" style="padding: 0;">
                
                <!-- Email Wrapper (600px max width) -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" class="email-container" style="width: 600px; max-width: 600px; margin: 0 auto;">
                    
                    <!-- Slice 1: Header -->
                    <tr>
                        <td>
                            <img src="https://raw.githubusercontent.com/dishaaggarwal6-gif/gisec-invite/main/gisec-invite_01.jpg" width="600" alt="GISEC Header" class="fluid" style="display: block; width: 100%; max-width: 600px;">
                        </td>
                    </tr>

                    <!-- Slice 2: Event Details -->
                    <tr>
                        <td>
                            <img src="https://raw.githubusercontent.com/dishaaggarwal6-gif/gisec-invite/main/gisec-invite_02.jpg" width="600" alt="Event Details" class="fluid" style="display: block; width: 100%; max-width: 600px;">
                        </td>
                    </tr>

                    <!-- Slice 3: Four Forces -->
                    <tr>
                        <td>
                            <img src="https://raw.githubusercontent.com/dishaaggarwal6-gif/gisec-invite/main/gisec-invite_03.jpg" width="600" alt="Four Forces" class="fluid" style="display: block; width: 100%; max-width: 600px;">
                        </td>
                    </tr>

                    <!-- Slice 4: Choose Your Journey -->
                    <tr>
                        <td>
                            <img src="https://raw.githubusercontent.com/dishaaggarwal6-gif/gisec-invite/main/gisec-invite_04.jpg" width="600" alt="Choose Your Journey" class="fluid" style="display: block; width: 100%; max-width: 600px;">
                        </td>
                    </tr>

                    <!-- Slice 5 -->
                    <tr>
                        <td>
                            <img src="https://raw.githubusercontent.com/dishaaggarwal6-gif/gisec-invite/main/gisec-invite_05.jpg" width="600" alt="Section 5" class="fluid" style="display: block; width: 100%; max-width: 600px;">
                        </td>
                    </tr>

                    <!-- Slice 6 -->
                    <tr>
                        <td>
                            <img src="https://raw.githubusercontent.com/dishaaggarwal6-gif/gisec-invite/main/gisec-invite_06.jpg" width="600" alt="Section 6" class="fluid" style="display: block; width: 100%; max-width: 600px;">
                        </td>
                    </tr>

                    <!-- Slice 7: CTA Button (BOOK A MEETING) - CLICKABLE -->
                    <tr>
                        <td>
                            <a href="https://your-booking-link-here.com" target="_blank" style="text-decoration: none; display: block;">
                                <img src="https://raw.githubusercontent.com/dishaaggarwal6-gif/gisec-invite/main/gisec-invite_07.jpg" width="600" alt="Book a Meeting with Our Experts" class="fluid" style="display: block; width: 100%; max-width: 600px;">
                            </a>
                        </td>
                    </tr>

                    <!-- Slice 8 -->
                    <tr>
                        <td>
                            <img src="https://raw.githubusercontent.com/dishaaggarwal6-gif/gisec-invite/main/gisec-invite_08.jpg" width="600" alt="Section 8" class="fluid" style="display: block; width: 100%; max-width: 600px;">
                        </td>
                    </tr>

                    <!-- Slice 9 -->
                    <tr>
                        <td>
                            <img src="https://raw.githubusercontent.com/dishaaggarwal6-gif/gisec-invite/main/gisec-invite_09.jpg" width="600" alt="Section 9" class="fluid" style="display: block; width: 100%; max-width: 600px;">
                        </td>
                    </tr>

                    <!-- Slice 10: Footer -->
                    <tr>
                        <td>
                            <img src="https://raw.githubusercontent.com/dishaaggarwal6-gif/gisec-invite/main/gisec-invite_10.jpg" width="600" alt="Footer" class="fluid" style="display: block; width: 100%; max-width: 600px;">
                        </td>
                    </tr>

                </table>
                <!-- End Email Wrapper -->

            </td>
        </tr>
    </table>

</body>
</html>
